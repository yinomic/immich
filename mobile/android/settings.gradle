pluginManagement {
  def flutterSdkPath = {
    def properties = new Properties()
    file("local.properties").withInputStream { properties.load(it) }
    def flutterSdkPath = properties.getProperty("flutter.sdk")
    assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
    return flutterSdkPath
  }()

  includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

  repositories {
    // Mainland-China mirrors only: dl.google.com, repo1.maven.org and
    // plugins.gradle.org are unreachable here and every lookup against them
    // stalls until the TCP timeout. The Tencent mirror proxies Google Maven,
    // Maven Central and the plugin portal; the others are fallbacks.
    maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public' }
    maven { url 'https://mirrors.huaweicloud.com/repository/maven' }
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
  }
}

plugins {
  id "dev.flutter.flutter-plugin-loader" version "1.0.0"
  id "com.android.application" version "8.11.2" apply false
  id "org.jetbrains.kotlin.android" version "2.2.20" apply false
  // TODO: update to match kotlin version when background_downloader is removed
  id "org.jetbrains.kotlin.plugin.serialization" version "2.1.0" apply false
  id "com.google.devtools.ksp" version "2.2.20-2.0.3" apply false
}

dependencyResolutionManagement {
  // PREFER_SETTINGS keeps plugin subprojects from adding their own google()
  // repositories, which would be unreachable from here.
  repositoriesMode = RepositoriesMode.PREFER_SETTINGS
  repositories {
    // Flutter engine artifacts (io.flutter:flutter_embedding_*, ~1.5 MB) live
    // only on download.flutter.io, and PREFER_SETTINGS makes Gradle ignore the
    // project-level repository the Flutter plugin injects, so the host has to
    // be declared here. Tencent's Flutter mirror measured ~78 KB/s here against
    // ~7 KB/s for flutter-io.cn and ~618 KB/s for Google, so the China mirrors
    // come first and Google is only the last resort.
    maven { url 'https://mirrors.cloud.tencent.com/flutter/download.flutter.io' }
    maven { url 'https://storage.flutter-io.cn/download.flutter.io' }
    maven { url 'https://storage.googleapis.com/download.flutter.io' }
    maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public' }
    maven { url 'https://mirrors.huaweicloud.com/repository/maven' }
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
  }
}

include ":app"
