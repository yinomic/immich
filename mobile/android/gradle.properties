org.gradle.jvmargs=-Xmx4096M
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
org.gradle.caching=true
org.gradle.parallel=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# dl.google.com / repo.maven.apache.org can be unreachable from mainland China.
# The mirrors below are tried first (see settings.gradle); these timeouts make
# Gradle give up on the unreachable originals in seconds instead of minutes.
systemProp.org.gradle.internal.http.connectionTimeout=8000
systemProp.org.gradle.internal.http.socketTimeout=300000
